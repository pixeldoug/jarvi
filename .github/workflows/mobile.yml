name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The app has its own lockfile: it is not an npm workspace (React 19 vs the web's 18).
    defaults:
      run:
        working-directory: packages/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
          cache-dependency-path: packages/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Expo doctor
        run: npx expo-doctor
